services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    networks:
      - scraping-investments-tcc_default
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:3.5.0-debian-11-r1
    container_name: kafka
    networks:
      - scraping-investments-tcc_default
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_ENABLE_KRAFT=no
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    depends_on:
      - zookeeper

  scrapper-app:
    image: openjdk:17-jdk-slim
    container_name: scrapper-app
    networks:
      - scraping-investments-tcc_default
    depends_on:
      - kafka
    volumes:
      - ./target/scraping-investments-0.0.1-SNAPSHOT.jar:/app/scraping-investments.jar
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=scraping-topico
    working_dir: /app
    entrypoint: ["java", "-jar", "scraping-investments.jar"]
    ports:
      - "8080:8080"
networks:
  scraping-investments-tcc_default:
    external: true
